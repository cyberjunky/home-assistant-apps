configuration:
  inverter:
    name: Omvormer
    description: >-
      Het IP-adres of de hostnaam van de GoodWe-omvormer (de wifi- of LAN-module)
      in je netwerk, en hoe vaak die wordt uitgelezen, in seconden. ES/EM/BP-
      omvormers hebben een kleine ingebouwde netwerkstack; 20 seconden is een
      veilige standaard, sneller uitlezen kan ze een tijdje laten zwijgen.
  forecast:
    name: Zonnevoorspelling
    description: >-
      Productievoorspelling per uur van Forecast.Solar (gratis, geen account),
      met Open-Meteo als reserve. Laat breedte- en lengtegraad op 0 om de
      thuislocatie van Home Assistant te gebruiken. Voeg onder panels per dakzijde
      (de panelen die dezelfde kant op kijken) een regel toe met piekvermogen
      (kWp), hellingshoek (0 = plat, 90 = verticaal) en azimut (0 = zuid,
      -90 = oost, 90 = west). De voorspelling stuurt het
      automatisch vasthouden van de accu.
  mqtt:
    name: MQTT
    description: >-
      Publiceer de omvormer via MQTT met Home Assistant discovery: sensoren voor
      zon, accu, net en huis, de accubesturing, en een event-entiteit voor
      moduswisselingen, omvormercommando's en meldingen. Laat host leeg om de
      broker van Home Assistant zelf (Mosquitto broker app) te gebruiken.
  miners:
    name: Miners (overschotverbruikers)
    description: >-
      De miners (of andere verbruikers) die de app aanzet met het zonne-overschot,
      één regel per stuk: een naam, de switch die hem start en stopt, de
      vermogenssensor met wat hij verbruikt (W of kW), en zijn nominale vermogen
      in W (optioneel met een sensor: de app leert het verbruik). Ze starten één
      voor één zolang het overschot de volgende dekt, en stoppen één voor één
      zodra het huis van het net haalt of de accu leegtrekt. Te zien op het
      dashboard, in de statistieken en als MQTT-sensoren; zet een miner op het
      dashboard op handmatig om hem erbuiten te houden.
  log_level:
    name: Logniveau
    description: Hoeveel detail de app naar het log schrijft.
