name: Garmin Connect
version: "0.1.0"
slug: app-garminconnect
description: "Unofficial Garmin Connect history and statistics for Home Assistant - your full history, kept at home, with insights the Garmin site doesn't show"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-garminconnect"
# The activity maps need core's map_tiles proxy (added in 2026.9)
homeassistant: "2026.9.0"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-garminconnect"
ingress: true
panel_icon: mdi:watch-variant
panel_title: Garmin
# Map tiles for the activity maps come through Home Assistant
homeassistant_api: true

options:
  update_interval_minutes: 30
  history:
    import: true
    start_date: ""
  datasets:
    daily: true
    sleep: true
    activities: true
    activity_tracks: true
    activity_details: true
    training: true
    body: true
    intraday: true
    records: true
    health_monitor: false
    performance: false
    nutrition: false
    menstrual: false
    golf: false
    sleep_detail: false
    intraday_more: false
    planning: false
  log_level: info

schema:
  update_interval_minutes: int(5,1440)?
  history:
    import: bool?
    start_date: 'match(^(\d{4}-\d{2}-\d{2})?$)?'
  datasets:
    daily: bool?
    sleep: bool?
    activities: bool?
    activity_tracks: bool?
    activity_details: bool?
    training: bool?
    body: bool?
    intraday: bool?
    records: bool?
    health_monitor: bool?
    performance: bool?
    nutrition: bool?
    menstrual: bool?
    golf: bool?
    sleep_detail: bool?
    intraday_more: bool?
    planning: bool?
  log_level: list(debug|info|warning|error)?
