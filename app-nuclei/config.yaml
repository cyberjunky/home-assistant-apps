# https://developers.home-assistant.io/docs/apps/configuration
name: Nuclei Scanner
version: "0.2.0"
slug: app-nuclei
description: "Internal vulnerability scanner for the devices Home Assistant tracks - open ports, CVEs and exposed services, as issues you work through"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-nuclei"
init: false
arch:
  - aarch64
  - amd64
image: "ghcr.io/cyberjunky/app-nuclei"
ingress: true
panel_icon: mdi:shield-search
panel_title: Nuclei
# Scanning needs to reach your devices; the host's network gives naabu and nuclei direct access
host_network: true
# The devices to scan are Home Assistant's device trackers that are home, on a private address
homeassistant_api: true
options:
  # Only device trackers that are home, on a private, loopback or link-local address, are ever scanned.
  # A device is scanned when it is new, and again once it is home and its last scan is this many days old
  rescan_days: 7
  max_concurrent_hosts: 25
  requests_per_second: 150
  # The lowest severity that becomes an issue: info, low, medium, high or critical
  min_severity: low
  nuclei_tags: ""
  nuclei_exclude_tags: "dos,fuzzing,intrusive"
  # nuclei's default-login checks: each product's own factory login. Off by default: it makes real
  # login attempts, which can lock accounts and trip alarms.
  default_credentials: false
  # Keep resolved issues and finished scans this many days (issues still there are always kept)
  retention_days: 365
  update_templates: true
  log_level: info
schema:
  rescan_days: int(1,365)
  max_concurrent_hosts: int(1,500)
  requests_per_second: int(1,1000)
  min_severity: list(info|low|medium|high|critical)
  nuclei_tags: str?
  nuclei_exclude_tags: str?
  default_credentials: bool
  retention_days: int(1,3650)
  update_templates: bool
  log_level: list(debug|info|warning|error)
