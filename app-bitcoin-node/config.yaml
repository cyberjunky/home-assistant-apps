name: Bitcoin Node
version: "0.1.4"
slug: app-bitcoin-node
description: "Dashboard for your own Bitcoin node - chain, mempool, fees and peers from Bitcoin Core, your Lightning wallet and channels from LND, and Tor"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-bitcoin-node"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-bitcoin-node"
ingress: true
panel_icon: mdi:bitcoin
panel_title: Bitcoin Node
services:
  - mqtt:want

options:
  bitcoin:
    url: ""
    username: ""
    password: ""
  lightning:
    url: ""
    macaroon: ""
    tls_cert: ""
    read_only: true
  tor:
    control: ""
    password: ""
  poll_seconds: 15
  history_days: 90
  mqtt:
    enabled: true
    host: ""
    port: 1883
    user: ""
    password: ""
    base_topic: bitcoin_node
    discovery_prefix: homeassistant
  log_level: info

schema:
  bitcoin:
    url: str?
    username: str?
    password: password?
  lightning:
    url: str?
    macaroon: password?
    tls_cert: str?
    read_only: bool?
  tor:
    control: str?
    password: password?
  poll_seconds: int(5,600)?
  history_days: int(1,3650)?
  mqtt:
    enabled: bool?
    host: str?
    port: port?
    user: str?
    password: password?
    base_topic: 'match(^[A-Za-z0-9_/-]+$)?'
    discovery_prefix: 'match(^[A-Za-z0-9_/-]+$)?'
  log_level: list(debug|info|warning|error)?
