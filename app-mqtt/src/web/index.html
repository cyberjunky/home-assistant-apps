<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The top bar is as high as Home Assistant's own header (its --header-height, 56px by default) -->
    <script>try{const h=getComputedStyle(window.parent.document.documentElement).getPropertyValue('--header-height').trim();if(h)document.documentElement.style.setProperty('--ha-header-height',h);}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234c8dff' d='M18,11H14.82C14.4,9.84 13.3,9 12,9C10.7,9 9.6,9.84 9.18,11H6C5.67,11 4,10.9 4,9V8C4,6.17 5.54,6 6,6H16.18C16.6,7.16 17.7,8 19,8A3,3 0 0,0 22,5A3,3 0 0,0 19,2C17.7,2 16.6,2.84 16.18,4H6C4.39,4 2,5.06 2,8V9C2,11.94 4.39,13 6,13H9.18C9.6,14.16 10.7,15 12,15C13.3,15 14.4,14.16 14.82,13H18C18.33,13 20,13.1 20,15V16C20,17.83 18.46,18 18,18H7.82C7.4,16.84 6.3,16 5,16A3,3 0 0,0 2,19A3,3 0 0,0 5,22C6.3,22 7.4,21.16 7.82,20H18C19.61,20 22,18.93 22,16V15C22,12.07 19.61,11 18,11M19,4A1,1 0 0,1 20,5A1,1 0 0,1 19,6A1,1 0 0,1 18,5A1,1 0 0,1 19,4M5,20A1,1 0 0,1 4,19A1,1 0 0,1 5,18A1,1 0 0,1 6,19A1,1 0 0,1 5,20Z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="static/app.css?v=__VERSION__"/>
    <link rel="stylesheet" href="static/mqtt.css?v=__VERSION__"/>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18,11H14.82C14.4,9.84 13.3,9 12,9C10.7,9 9.6,9.84 9.18,11H6C5.67,11 4,10.9 4,9V8C4,6.17 5.54,6 6,6H16.18C16.6,7.16 17.7,8 19,8A3,3 0 0,0 22,5A3,3 0 0,0 19,2C17.7,2 16.6,2.84 16.18,4H6C4.39,4 2,5.06 2,8V9C2,11.94 4.39,13 6,13H9.18C9.6,14.16 10.7,15 12,15C13.3,15 14.4,14.16 14.82,13H18C18.33,13 20,13.1 20,15V16C20,17.83 18.46,18 18,18H7.82C7.4,16.84 6.3,16 5,16A3,3 0 0,0 2,19A3,3 0 0,0 5,22C6.3,22 7.4,21.16 7.82,20H18C19.61,20 22,18.93 22,16V15C22,12.07 19.61,11 18,11M19,4A1,1 0 0,1 20,5A1,1 0 0,1 19,6A1,1 0 0,1 18,5A1,1 0 0,1 19,4M5,20A1,1 0 0,1 4,19A1,1 0 0,1 5,18A1,1 0 0,1 6,19A1,1 0 0,1 5,20Z"/></svg>
            <span class="brand-name">MQTT</span>
            <span class="brand-sub" id="brand-sub"></span>
        </div>
        <nav class="tabs" id="nav" aria-label="Views">
            <button type="button" class="tab" data-tab="overview" onclick="switchTab('overview')">Dashboard</button>
            <button type="button" class="tab" data-tab="clients" onclick="switchTab('clients')">Clients</button>
            <button type="button" class="tab" data-tab="topics" onclick="switchTab('topics')">Topics</button>
            <button type="button" class="tab" data-tab="traffic" onclick="switchTab('traffic')">Traffic</button>
            <button type="button" class="tab" data-tab="discovery" onclick="switchTab('discovery')">Discovery</button>
            <button type="button" class="tab" data-tab="stats" onclick="switchTab('stats')">Stats</button>
            <button type="button" class="tab" data-tab="log" onclick="switchTab('log')">Log</button>
            <span class="tab-sep" aria-hidden="true"></span>
            <button type="button" class="tab" data-tab="info" onclick="switchTab('info')" title="Info"><span class="tab-label">Info</span><span class="tab-icon" aria-hidden="true">ⓘ</span></button>
        </nav>
        <span class="spacer"></span>
        <div class="tabs" role="group" aria-label="Theme">
            <button type="button" id="theme-toggle" class="tab icon-tab" onclick="cycleTheme()" title="Theme"><span id="theme-icon" aria-hidden="true">🌓</span></button>
        </div>
        <span id="clock" class="clock"></span>
    </header>

    <div class="views">
        <div class="pages" id="pages">
            <div class="container">
                <!-- Each page fills its own container; see the script of the same name -->
                <div id="notices"></div>
                <div id="tab-overview" class="tab-content"></div>
                <div id="tab-clients" class="tab-content"></div>
                <div id="tab-topics" class="tab-content"></div>
                <div id="tab-traffic" class="tab-content"></div>
                <div id="tab-discovery" class="tab-content"></div>
                <div id="tab-stats" class="tab-content"></div>
                <div id="tab-log" class="tab-content"></div>
                <div id="tab-info" class="tab-content"></div>
            </div>
        </div>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
    <div id="toast-root"></div>
    <div id="modal-root"></div>

    <script src="static/core.js?v=__VERSION__"></script>
    <script src="static/charts.js?v=__VERSION__"></script>
    <script src="static/overview.js?v=__VERSION__"></script>
    <script src="static/clients.js?v=__VERSION__"></script>
    <script src="static/topics.js?v=__VERSION__"></script>
    <script src="static/traffic.js?v=__VERSION__"></script>
    <script src="static/discovery.js?v=__VERSION__"></script>
    <script src="static/stats.js?v=__VERSION__"></script>
    <script src="static/log.js?v=__VERSION__"></script>
    <script src="static/info.js?v=__VERSION__"></script>
    <script src="static/main.js?v=__VERSION__"></script>
    <script src="static/donate.js?v=__VERSION__" data-app="MQTT" data-api="api/donate"></script>
</body>
</html>
