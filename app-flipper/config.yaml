# https://developers.home-assistant.io/docs/apps/configuration
name: Flipper
version: "0.1.2"
slug: app-flipper
description: "A workbench for a Flipper Zero on USB - see its screen, press its buttons, manage its files, and write, build and run apps on it"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-flipper"
init: false
arch:
  - aarch64
  - amd64
image: "ghcr.io/cyberjunky/app-flipper"
# The Flipper is a USB serial device (/dev/ttyACM*, /dev/serial/by-id/usb-Flipper_Devices_Inc._Flipper_*)
uart: true
udev: true
ingress: true
panel_icon: mdi:dolphin
panel_title: Flipper
# The Flipper SDK and compiler (1.5 GB) are downloaded again when needed; projects are backed up
backup_exclude:
  - ufbt/**
options:
  log_level: info
schema:
  device: "device(subsystem=tty)?"
  log_level: list(debug|info|warning|error)
