name: Lottery
version: "0.1.0"
slug: app-lottery
description: "Dashboard for your Bitaxe, NerdQAxe and other AxeOS solo miners - your odds of a block, every miner's stats, and their sensors and Mining switch in Home Assistant over MQTT"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-lottery"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-lottery"
ingress: true
panel_icon: mdi:ticket-confirmation-outline
panel_title: Lottery
services:
  - mqtt:want

options:
  miners: []
  poll_seconds: 15
  network_data: true
  firmware_check: true
  mqtt:
    enabled: true
    host: ""
    port: 1883
    user: ""
    password: ""
    base_topic: lottery
    discovery_prefix: homeassistant
  log_level: info

schema:
  miners:
    - name: str
      host: str
  poll_seconds: int(5,300)?
  network_data: bool?
  firmware_check: bool?
  mqtt:
    enabled: bool?
    host: str?
    port: port?
    user: str?
    password: password?
    base_topic: 'match(^[A-Za-z0-9_/-]+$)?'
    discovery_prefix: 'match(^[A-Za-z0-9_/-]+$)?'
  log_level: list(debug|info|warning|error)?
