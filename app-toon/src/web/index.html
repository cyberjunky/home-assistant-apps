<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toon</title>
<style>
:root {
  color-scheme: light;
  --surface: #f6f6f4; --card: #fcfcfb; --line: #e4e3df; --grid: #ecebe7;
  --text: #0b0b0b; --text2: #52514e; --text3: #75746f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #1baf7a; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #111110; --card: #1a1a19; --line: #2e2e2c; --grid: #262624;
    --text: #f0efec; --text2: #c3c2b7; --text3: #9a998f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --good: #199e70; --critical: #e66767;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 600; }
h2 { font-size: 14px; margin: 24px 0 8px; font-weight: 600; color: var(--text2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--card); font-size: 13px; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--text3)); }
.muted { color: var(--text3); font-size: 13px; }
.notice { padding: 8px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-left: 3px solid var(--critical);
  border-radius: 6px; background: var(--card); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.tile b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile span { color: var(--text2); font-size: 12px; }
.ranges { display: flex; gap: 4px; margin-left: auto; }
button { font: inherit; color: var(--text2); background: var(--card); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 10px; cursor: pointer; }
button[aria-pressed="true"] { color: var(--text); border-color: var(--text3); font-weight: 600; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 8px; }
figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  position: relative; min-width: 0; }
figcaption { font-weight: 600; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--text2); min-height: 18px; }
.legend i { display: inline-block; width: 14px; height: 2px; margin-right: 5px; vertical-align: middle; }
svg { display: block; width: 100%; height: 180px; touch-action: pan-y; }
svg text { fill: var(--text3); font-size: 11px; }
.tip { position: absolute; pointer-events: none; display: none; background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; z-index: 2; box-shadow: 0 2px 8px #0002; white-space: nowrap; }
.tip div { display: flex; align-items: center; gap: 6px; }
.tip i { width: 12px; height: 2px; }
.tip b { font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--grid); }
th { color: var(--text2); font-weight: 600; }
.scroll { overflow-x: auto; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--text2); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Toon</h1>
    <span id="link" class="pill">…</span>
    <span id="about" class="muted"></span>
  </header>
  <div id="notices"></div>

  <h2>Heating</h2>
  <div id="tiles-heating" class="tiles"></div>
  <h2>Energy</h2>
  <div id="tiles-energy" class="tiles"></div>
  <h2>The Toon itself</h2>
  <div id="tiles-health" class="tiles"></div>

  <header style="margin: 24px 0 8px">
    <h2 style="margin: 0">History</h2>
    <div class="ranges" id="ranges"></div>
  </header>
  <div id="charts" class="charts"></div>

  <h2>Connection history</h2>
  <p class="muted" style="margin: 0 0 8px">Restarted means the Toon rebooted during the outage. Connection lost means it kept running but could not be reached.</p>
  <div class="scroll"><table id="outages"></table></div>
</main>
<script src="static/app.js"></script>
</body>
</html>
