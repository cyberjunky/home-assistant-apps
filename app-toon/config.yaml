name: Toon
version: "0.5.4"
slug: app-toon
description: "Logger and dashboard for a rooted Toon thermostat - boiler, heating, energy and the Toon's own health"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-toon"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-toon"
ingress: true
panel_icon: mdi:thermostat
panel_title: Toon
# The sensors named under external_sensors and outside_temperature
homeassistant_api: true
services:
  - mqtt:want

options:
  ssh:
    host: ""
    port: 22
    username: root
    password: ""
    trust_new_host_key: false
  import_history: true
  raw_retention_days: 90
  mqtt:
    enabled: true
    host: ""
    port: 1883
    user: ""
    password: ""
    base_topic: toon
    discovery_prefix: homeassistant
  read_only: false
  gas_kwh_per_m3: 9.77
  external_sensors: []
  prices: []
  log_level: info

schema:
  ssh:
    host: str
    port: port
    username: str
    password: password
    trust_new_host_key: bool?
  import_history: bool?
  raw_retention_days: int(1,3650)?
  mqtt:
    enabled: bool?
    host: str?
    port: port?
    user: str?
    password: password?
    base_topic: 'match(^[A-Za-z0-9_/-]+$)?'
    discovery_prefix: 'match(^[A-Za-z0-9_/-]+$)?'
  boiler_name: str?
  read_only: bool?
  gas_kwh_per_m3: float(1,20)?
  outside_temperature: 'match(^[a-z_]+\.[a-z0-9_]+$)?'
  external_sensors:
    - name: str
      entity: 'match(^[a-z_]+\.[a-z0-9_]+$)'
  prices:
    - start: 'match(^\d{4}-\d{2}-\d{2}$)'
      electricity_low: float
      electricity_normal: float
      return_low: float?
      return_normal: float?
      electricity_fixed_per_day: float?
      gas: float
      gas_fixed_per_day: float?
  log_level: list(debug|info|warning|error)?
