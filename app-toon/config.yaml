name: Toon
version: "0.1.2"
slug: app-toon
description: "Logger and dashboard for a rooted Toon thermostat - boiler, heating, energy and the Toon's own health"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-toon"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-toon"
ingress: true
panel_icon: mdi:thermostat
panel_title: Toon
# The MQTT broker from the Supervisor
hassio_api: true
services:
  - mqtt:want

options:
  ssh:
    host: ""
    port: 22
    username: root
    password: ""
    trust_new_host_key: false
  import_history: true
  raw_retention_days: 90
  mqtt:
    enabled: true
    host: ""
    port: 1883
    user: ""
    password: ""
    base_topic: toon
    discovery_prefix: homeassistant
  log_level: info

schema:
  ssh:
    host: str
    port: port
    username: str
    password: password
    trust_new_host_key: bool?
  import_history: bool?
  raw_retention_days: int(1,3650)?
  mqtt:
    enabled: bool?
    host: str?
    port: port?
    user: str?
    password: password?
    base_topic: 'match(^[A-Za-z0-9_/-]+$)?'
    discovery_prefix: 'match(^[A-Za-z0-9_/-]+$)?'
  log_level: list(debug|info|warning|error)?
