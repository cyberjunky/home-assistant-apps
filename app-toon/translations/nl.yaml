configuration:
  ssh:
    name: SSH-verbinding
    description: Hoe je Toon bereikt wordt. Alle gegevens gaan via deze ene verbinding.
    fields:
      host:
        name: Adres
        description: IP-adres of hostnaam van de Toon.
      port:
        name: Poort
        description: SSH-poort van de Toon, normaal 22.
      username:
        name: Gebruikersnaam
        description: SSH-gebruiker, normaal root.
      password:
        name: Wachtwoord
        description: SSH-wachtwoord van die gebruiker.
      trust_new_host_key:
        name: Nieuwe SSH-sleutel vertrouwen
        description: >-
          Accepteer een gewijzigde SSH-sleutel van de Toon. Zet dit eenmalig
          aan na het opnieuw installeren van de software van de Toon, en daarna
          weer uit.
  import_history:
    name: Geschiedenis importeren
    description: Lees de geschiedenis die de Toon zelf bijhoudt, tot 10 jaar terug, in de database.
  raw_retention_days:
    name: Metingen bewaren (dagen)
    description: Hoe lang elke afzonderlijke meting bewaard blijft. Uurwaarden blijven altijd bewaard.
  mqtt:
    name: MQTT
    description: >-
      Publiceert de Toon naar Home Assistant. Laat de host leeg om de broker
      te gebruiken die Home Assistant kent.
    fields:
      enabled:
        name: Ingeschakeld
        description: Publiceer de Toon via MQTT.
      host:
        name: Host
        description: Adres van de broker.
      port:
        name: Poort
        description: Poort van de broker.
      user:
        name: Gebruiker
        description: Gebruiker voor de broker.
      password:
        name: Wachtwoord
        description: Wachtwoord voor de broker.
      base_topic:
        name: Basistopic
        description: Topic waaronder de status van de Toon wordt gepubliceerd.
      discovery_prefix:
        name: Discovery-prefix
        description: De discovery-prefix van Home Assistant.
  boiler_name:
    name: Naam van de ketel
    description: Merk en type van je ketel, getoond op het dashboard en bij Instellingen. Alleen een label.
  read_only:
    name: Alleen lezen
    description: Zet de bediening op het dashboard uit, zodat deze app niets op je Toon kan wijzigen.
  gas_kwh_per_m3:
    name: Energie in gas (kWh per m³)
    description: >-
      Rekent je gasverbruik om naar kWh op de pagina Stats. 9,77 is de bovenwaarde
      van Nederlands gas; op je energierekening kan een iets ander getal staan.
  outside_temperature:
    name: Sensor buitentemperatuur
    description: Een Home Assistant-entiteit met de buitentemperatuur, bijvoorbeeld sensor.outside_temperature.
  external_sensors:
    name: Externe sensoren
    description: >-
      Andere Home Assistant-sensoren om te loggen en in de grafieken te tonen, zoals
      1-wire leidingsensoren. Elk heeft een naam en een entiteit. Houd de naam gelijk:
      de geschiedenis wordt daaronder bewaard.
    fields:
      name:
        name: Naam
        description: De naam op het dashboard.
      entity:
        name: Entiteit
        description: De Home Assistant-entiteit, bijvoorbeeld sensor.pipe_supply.
  log_level:
    name: Logniveau
    description: Hoeveelheid logging.
