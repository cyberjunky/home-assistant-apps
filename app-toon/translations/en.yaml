configuration:
  ssh:
    name: SSH connection
    description: How to reach your Toon. All data goes through this one connection.
    fields:
      host:
        name: Address
        description: IP address or host name of the Toon.
      port:
        name: Port
        description: SSH port of the Toon, normally 22.
      username:
        name: Username
        description: SSH user, normally root.
      password:
        name: Password
        description: SSH password of that user.
      trust_new_host_key:
        name: Trust a new SSH key
        description: >-
          Accept a changed SSH key of the Toon. Turn this on once after
          reinstalling the Toon's software, then off again.
  import_history:
    name: Import history
    description: Read the history the Toon keeps itself, up to 10 years, into the database.
  raw_retention_days:
    name: Keep samples (days)
    description: How long every single sample is kept. Hourly values are kept for good.
  mqtt:
    name: MQTT
    description: >-
      Publishes the Toon to Home Assistant. Leave the host empty to use the
      broker Home Assistant knows.
    fields:
      enabled:
        name: Enabled
        description: Publish the Toon over MQTT.
      host:
        name: Host
        description: Address of the broker.
      port:
        name: Port
        description: Port of the broker.
      user:
        name: User
        description: User for the broker.
      password:
        name: Password
        description: Password for the broker.
      base_topic:
        name: Base topic
        description: Topic under which the Toon's state is published.
      discovery_prefix:
        name: Discovery prefix
        description: Home Assistant's discovery prefix.
  boiler_name:
    name: Boiler name
    description: The make and model of your boiler, shown on the Dashboard and in Settings. Only a label.
  read_only:
    name: Read-only
    description: Turn off the Dashboard's controls, so this app can't change anything on your Toon.
  gas_kwh_per_m3:
    name: Energy in gas (kWh per m³)
    description: >-
      Turns the gas you use into kWh on the Stats page. 9.77 is the upper heating
      value of Dutch gas; your energy bill may show a slightly different number.
  outside_temperature:
    name: Outside temperature sensor
    description: A Home Assistant entity with the outside temperature, for example sensor.outside_temperature.
  external_sensors:
    name: External sensors
    description: >-
      Other Home Assistant sensors to log and show in the charts, such as 1-wire
      pipe sensors. Each has a name and an entity. Keep the name once set: its
      history is stored under it.
    fields:
      name:
        name: Name
        description: The name shown on the dashboard.
      entity:
        name: Entity
        description: The Home Assistant entity, for example sensor.pipe_supply.
  prices:
    name: Energy prices
    description: >-
      Your contract prices, for the costs on the Electricity and Gas & heating
      pages. Add a new entry when prices change: each applies from its start date
      until the next one. Prices in euro, including VAT and energy tax.
    fields:
      start:
        name: From
        description: The first day of these prices, for example 2026-01-01.
      electricity_low:
        name: Electricity, low tariff (€/kWh)
        description: What a kWh from the grid costs in the low tariff.
      electricity_normal:
        name: Electricity, normal tariff (€/kWh)
        description: What a kWh from the grid costs in the normal tariff.
      return_low:
        name: Returned, low tariff (€/kWh)
        description: What a kWh to the grid earns. Empty is the same as the price from the grid (net metering).
      return_normal:
        name: Returned, normal tariff (€/kWh)
        description: What a kWh to the grid earns. Empty is the same as the price from the grid (net metering).
      electricity_fixed_per_day:
        name: Electricity, fixed costs per day (€)
        description: Standing charge and network costs per day, minus the energy tax credit. May be negative.
      gas:
        name: Gas (€/m³)
        description: What a m³ of gas costs.
      gas_fixed_per_day:
        name: Gas, fixed costs per day (€)
        description: Standing charge and network costs for gas per day.
  log_level:
    name: Log level
    description: Amount of logging.
