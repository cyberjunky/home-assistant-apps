configuration:
  database_host:
    name: Database-host
    description: >-
      De hostnaam van de Chronicle-app. Leeg laten: Vigil vindt Chronicle zelf.
  database_port:
    name: Databasepoort
    description: De poort van PostgreSQL op de Chronicle-app, normaal 5432.
  database_name:
    name: Database
    description: >-
      De database die Chronicle voor Vigil maakte (Onderhoud → App-databases).
  database_user:
    name: Databaselogin
    description: De login die Chronicle bij die database maakte, normaal dezelfde naam.
  database_password:
    name: Databasewachtwoord
    description: Het wachtwoord dat Chronicle liet zien bij het maken van de database.
  ingest_token:
    name: Ingest-token
    description: >-
      Het token dat afzenders moeten meegeven voor OpenTelemetry en JSON op poort
      4318 (Authorization: Bearer <token>). Zonder token worden alleen afzenders
      op je eigen netwerk geaccepteerd. Syslog heeft geen token nodig.
  scrape_targets:
    name: Prometheus-doelen
    description: >-
      Exporters om metrics van te verzamelen, zoals node_exporter op een server:
      een naam, de volledige URL van de /metrics-pagina en het interval in seconden.
  fritzbox:
    name: FRITZ!Box (TR-064)
    description: >-
      Doorvoer van de lijn, verbindingsstatus en het gebeurtenissenlog, opgevraagd
      bij de FRITZ!Box via TR-064. Laat het adres leeg om over te slaan.
    fields:
      host:
        name: Adres
        description: Het adres van de FRITZ!Box, zoals 192.168.178.1 of fritz.box.
      user:
        name: Gebruiker
        description: Een FRITZ!Box-gebruiker met het recht "FRITZ!Box-instellingen".
      password:
        name: Wachtwoord
        description: Het wachtwoord van die gebruiker.
  notify_service:
    name: Meldingsdienst
    description: >-
      Waar meldingen naast een Home Assistant-melding heen gaan: elke actie met een
      titel en een bericht, zoals notify.mobile_app_mijn_telefoon of
      telegram_bot.send_message. Leeg laten voor alleen meldingen.
  logs_retention_days:
    name: Logs bewaren (dagen)
    description: Hoe lang logs bewaard blijven.
  metrics_retention_days:
    name: Metrics bewaren (dagen)
    description: Hoe lang metrics bewaard blijven.
  log_level:
    name: Logniveau
    description: Hoeveelheid logging van de app zelf.
network:
  5514/udp: >-
    Syslog via UDP, voor routers, switches en servers. Stuur ze naar het adres
    van Home Assistant op deze poort (514 is de gebruikelijke).
  5514/tcp: Syslog via TCP, voor rsyslog en andere afzenders die een verbinding openhouden.
  4318/tcp: >-
    OpenTelemetry (OTLP/HTTP, JSON) en JSON-regels, voor Vector en de
    OpenTelemetry Collector, met het ingest-token.
