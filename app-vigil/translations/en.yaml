configuration:
  database_host:
    name: Database host
    description: >-
      The Chronicle app's host name. Leave empty: Vigil finds Chronicle by itself.
  database_port:
    name: Database port
    description: PostgreSQL's port on the Chronicle app, normally 5432.
  database_name:
    name: Database
    description: >-
      The database made for Vigil in Chronicle (Maintenance → App databases).
  database_user:
    name: Database login
    description: The login Chronicle made with that database, normally the same name.
  database_password:
    name: Database password
    description: The password Chronicle showed when it made the database.
  ingest_token:
    name: Ingest token
    description: >-
      The token senders must give for OpenTelemetry and JSON on port 4318
      (Authorization: Bearer <token>). Without one, only senders on your own
      network are accepted. Syslog needs no token.
  scrape_targets:
    name: Prometheus targets
    description: >-
      Exporters to collect metrics from, such as node_exporter on a server:
      a name, the full URL of its /metrics page and the interval in seconds.
  fritzbox:
    name: FRITZ!Box (TR-064)
    description: >-
      Line throughput, connection state and the event log, asked from the FRITZ!Box
      over TR-064. Leave the address empty to skip.
    fields:
      host:
        name: Address
        description: The FRITZ!Box's address, such as 192.168.178.1 or fritz.box.
      user:
        name: User
        description: A FRITZ!Box user with the right "FRITZ!Box Settings".
      password:
        name: Password
        description: That user's password.
  mikrotik:
    name: MikroTik (RouterOS API)
    description: >-
      CPU, memory, temperature, every interface's traffic and state, DHCP leases,
      Wi-Fi clients and connections, asked from the router over its API. Leave the
      address empty to skip. Logs come by syslog (see Sources).
    fields:
      host:
        name: Address
        description: The router's IP address, such as 192.168.88.1.
      user:
        name: User
        description: A router user in a group with only the read and api policies.
      password:
        name: Password
        description: That user's password.
      port:
        name: Port
        description: Empty for the default (8728, or 8729 with SSL).
      ssl:
        name: API-SSL
        description: Use the API's SSL service (needs a certificate on the router).
  notify_service:
    name: Notify service
    description: >-
      Where alerts go besides a Home Assistant notification: any action that takes
      a title and a message, such as notify.mobile_app_my_phone or
      telegram_bot.send_message. Leave empty for notifications only.
  logs_retention_days:
    name: Keep logs (days)
    description: How long logs are kept.
  metrics_retention_days:
    name: Keep metrics (days)
    description: How long metrics are kept.
  log_level:
    name: Log level
    description: Amount of logging of the app itself.
network:
  5514/udp: >-
    Syslog over UDP, for routers, switches and servers. Point them at Home
    Assistant's address on this port (514 is the usual one).
  5514/tcp: Syslog over TCP, for rsyslog and other senders that keep a connection.
  4318/tcp: >-
    OpenTelemetry (OTLP/HTTP, JSON) and JSON lines, for Vector and the
    OpenTelemetry Collector, with the ingest token.
