name: Arcade
version: "0.6.3"
slug: app-arcade
description: "Arcade games in Home Assistant: MAME in your browser, with high scores kept. No games included, bring ROMs you have the right to use"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-arcade"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-arcade"
ingress: true
# Pass uploads (backups, imports, ROMs) straight to the app: without this the Supervisor reads
# the whole request first and refuses anything over 16 MB (413 Content Too Large)
ingress_stream: true
panel_icon: mdi:gamepad-variant
panel_title: Arcade
# The ROM folder lives in /share (reachable over Samba) or /media
map:
  - type: share
    read_only: false
  - type: media
    read_only: false

options:
  rom_folder: /share/arcade/roms
  log_level: info

schema:
  rom_folder: 'match(^/(share|media)/.+$)'
  log_level: list(debug|info|warning|error)?
