<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The top bar is as high as Home Assistant's own header (its --header-height, 56px by default) -->
    <script>try{const h=getComputedStyle(window.parent.document.documentElement).getPropertyValue('--header-height').trim();if(h)document.documentElement.style.setProperty('--ha-header-height',h);}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxmox</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e57000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='6' rx='1.5'/%3E%3Crect x='3' y='14' width='18' height='6' rx='1.5'/%3E%3Cpath d='M7 7h.01M7 17h.01M11 7h6M11 17h6'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="static/app.css?v=__VERSION__"/>
    <link rel="stylesheet" href="static/network.css?v=__VERSION__"/>
    <link rel="stylesheet" href="static/firewall.css?v=__VERSION__"/>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/></svg>
            <span class="brand-name">PROXMOX</span>
            <span class="brand-sub" id="brand-sub"></span>
        </div>
        <nav class="tabs" id="nav" aria-label="Views">
            <button type="button" class="tab" data-tab="overview" onclick="switchTab('overview')">Overview</button>
            <button type="button" class="tab" data-tab="nodes" onclick="switchTab('nodes')">Nodes</button>
            <button type="button" class="tab" data-tab="guests" onclick="switchTab('guests')">Guests</button>
            <button type="button" class="tab" data-tab="storage" onclick="switchTab('storage')">Storage</button>
            <button type="button" class="tab" data-tab="backups" onclick="switchTab('backups')">Backups</button>
            <button type="button" class="tab" data-tab="network" onclick="switchTab('network')">Network</button>
            <button type="button" class="tab" data-tab="firewall" onclick="switchTab('firewall')">Firewall</button>
            <button type="button" class="tab" data-tab="tasks" onclick="switchTab('tasks')">Tasks</button>
            <span class="tab-sep" aria-hidden="true"></span>
            <button type="button" class="tab" data-tab="info" onclick="switchTab('info')" title="Info"><span class="tab-label">Info</span><span class="tab-icon" aria-hidden="true">ⓘ</span></button>
        </nav>
        <span class="spacer"></span>
        <div class="tabs" role="group" aria-label="Theme">
            <button type="button" id="theme-toggle" class="tab icon-tab" onclick="cycleTheme()" title="Theme"><span id="theme-icon" aria-hidden="true">🌓</span></button>
        </div>
        <span id="clock" class="clock"></span>
    </header>

    <div class="views">
        <div class="pages" id="pages">
            <div class="container">
                <!-- Each page fills its own container; see the script of the same name -->
                <div id="notices"></div>
                <div id="tab-overview" class="tab-content"></div>
                <div id="tab-nodes" class="tab-content"></div>
                <div id="tab-guests" class="tab-content"></div>
                <div id="tab-storage" class="tab-content"></div>
                <div id="tab-backups" class="tab-content"></div>
                <div id="tab-network" class="tab-content"></div>
                <div id="tab-firewall" class="tab-content"></div>
                <div id="tab-tasks" class="tab-content"></div>
                <div id="tab-info" class="tab-content"></div>
            </div>
        </div>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
    <div id="toast-root"></div>
    <div id="modal-root"></div>

    <script src="static/core.js?v=__VERSION__"></script>
    <script src="static/charts.js?v=__VERSION__"></script>
    <script src="static/overview.js?v=__VERSION__"></script>
    <script src="static/nodes.js?v=__VERSION__"></script>
    <script src="static/guests.js?v=__VERSION__"></script>
    <script src="static/storage.js?v=__VERSION__"></script>
    <script src="static/pbs.js?v=__VERSION__"></script>
    <script src="static/backups.js?v=__VERSION__"></script>
    <script src="static/network.js?v=__VERSION__"></script>
    <script src="static/firewall.js?v=__VERSION__"></script>
    <script src="static/tasks.js?v=__VERSION__"></script>
    <script src="static/info.js?v=__VERSION__"></script>
    <script src="static/main.js?v=__VERSION__"></script>
    <script src="static/donate.js?v=__VERSION__" data-app="Proxmox" data-api="api/donate"></script>
</body>
</html>
