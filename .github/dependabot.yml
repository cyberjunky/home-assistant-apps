# Dependabot keeps the GitHub Actions and the Docker base images current. Every pull request
# it opens is test-built by the Builder workflow.
# Versions declared as ARG lines in the Dockerfiles (pgAdmin, TimescaleDB and its extensions,
# Dishylink's upstream tag) are not covered and stay manual.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /app-dishylink
      - /app-meldkamer
      - /app-pgadmin4
      - /app-teslameter
      - /app-timescaledb
    schedule:
      interval: monthly
    ignore:
      # Base image majors (Alpine or Python line changes) are decided by hand.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # TeslaMeter's Python packages, pinned in its requirements.txt and installed in its Dockerfile.
  - package-ecosystem: pip
    directory: /app-teslameter
    schedule:
      interval: monthly
    groups:
      python:
        patterns:
          - "*"
