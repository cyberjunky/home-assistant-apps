---
name: Build Arcade MAME

# Compiles MAME to WebAssembly with the drivers in app-arcade/mame/drivers.txt and pushes
# it to ghcr.io/<owner>/arcade/dependency/mame-wasm:<tag>. The tag is the MAME_WASM line of
# app-arcade/Dockerfile ("<MAME release tag>-<build number>"), so the app always copies the
# build it names. Runs when app-arcade/mame/ or that line changes; an existing tag is not
# rebuilt unless the run is started by hand with "force".
#
# The compile takes about an hour. WebAssembly runs on every architecture, so it is built
# once and published for amd64 and arm64 (an image with only /mame in it).

# yamllint disable-line rule:truthy
on:
  push:
    paths:
      - "app-arcade/mame/**"
      - "app-arcade/Dockerfile"
      - ".github/workflows/build-arcade-mame.yaml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the tag exists"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/arcade/dependency

jobs:
  build:
    name: Build mame-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Read the tag
        id: tag
        run: |
          tag="$(sed -n 's/^ARG MAME_WASM=//p' app-arcade/Dockerfile)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "mame=${tag%-*}" >> "${GITHUB_OUTPUT}"
          echo "MAME_WASM=${tag}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether it exists
        id: exists
        run: |
          if [ "${{ inputs.force }}" != "true" ] && docker buildx imagetools inspect "${REGISTRY}/mame-wasm:${{ steps.tag.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${REGISTRY}/mame-wasm:${{ steps.tag.outputs.tag }} exists, nothing to build"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.exists.outputs.exists != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push
        if: steps.exists.outputs.exists != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: app-arcade/mame
          platforms: linux/amd64,linux/arm64
          build-args: |
            MAME_TAG=${{ steps.tag.outputs.mame }}
          cache-from: type=gha,scope=arcade-mame
          cache-to: type=gha,scope=arcade-mame,mode=max
          push: true
          tags: ${{ env.REGISTRY }}/mame-wasm:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.title=MAME WebAssembly build for the Arcade app
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=GPL-2.0-or-later
