name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: Find app directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      # One app's lint failure shouldn't cancel the others' — report each independently.
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

  # Lint and format-check the apps that ship their own Python application;
  # each uses its own ruff.toml.
  ruff:
    name: Ruff (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - app-goodwe
          - app-meldkamer
          - app-teslameter
          - app-toon
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          args: check
          src: ${{ matrix.app }}

      - name: Format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check
          src: ${{ matrix.app }}
