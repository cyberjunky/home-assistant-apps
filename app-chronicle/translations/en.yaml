configuration:
  max_memory:
    name: Memory
    description: >-
      The memory PostgreSQL is tuned for, such as 512MB or 2GB. More makes large
      queries and charts faster; leave room for Home Assistant and the other apps.
  log_level:
    name: Log level
    description: Amount of logging.
network:
  5432/tcp: >-
    PostgreSQL. Only needed to reach the database from outside Home Assistant,
    for example from Grafana on another machine, with a read-only login.
