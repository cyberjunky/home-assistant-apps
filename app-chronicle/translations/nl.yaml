configuration:
  max_memory:
    name: Geheugen
    description: >-
      Het geheugen waarop PostgreSQL wordt afgestemd, zoals 512MB of 2GB. Meer maakt
      grote query's en grafieken sneller; laat ruimte voor Home Assistant en de andere apps.
  log_level:
    name: Logniveau
    description: Hoeveelheid logging.
network:
  5432/tcp: >-
    PostgreSQL. Alleen nodig om de database van buiten Home Assistant te bereiken,
    bijvoorbeeld vanuit Grafana op een andere machine, met een alleen-lezen login.
