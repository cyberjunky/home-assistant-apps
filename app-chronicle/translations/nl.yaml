configuration:
  host:
    name: Databaseserver
    description: >-
      Waar de database draait: de TimescaleDB-app uit deze repository
      (1b41fb55-timescaledb), of een hostnaam of IP-adres.
  port:
    name: Poort
    description: De poort van de database, 5432 voor PostgreSQL.
  username:
    name: Gebruikersnaam
    description: De databasegebruiker, postgres voor de TimescaleDB-app.
  password:
    name: Wachtwoord
    description: Het wachtwoord van de databasegebruiker.
  database:
    name: Database
    description: De database waarin de Chronicle-integratie opslaat.
  log_level:
    name: Logniveau
    description: Hoeveelheid logging.
