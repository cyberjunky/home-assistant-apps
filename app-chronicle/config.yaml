name: Chronicle
version: "0.1.2"
slug: app-chronicle
description: "Browse the long-term history the Chronicle integration keeps in TimescaleDB - entities, charts, storage and compression"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-chronicle"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-chronicle"
ingress: true
panel_icon: mdi:database-clock
panel_title: Chronicle

# The database the Chronicle integration records into; the app only reads from it
options:
  host: 1b41fb55-timescaledb
  port: 5432
  username: postgres
  password: ""
  database: homeassistant
  log_level: info

schema:
  host: str
  port: port
  username: str
  password: password
  database: str
  log_level: list(debug|info|warning|error)?
