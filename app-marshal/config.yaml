# https://developers.home-assistant.io/docs/apps/configuration
name: Marshal
version: "0.1.0"
slug: app-marshal
description: "Keeps watch over your Marketplace integrations - reads their code for credential and data access, risky code, internet hosts and slow patterns, and ranks them"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-marshal"
init: false
arch:
  - aarch64
  - amd64
image: "ghcr.io/cyberjunky/app-marshal"
ingress: true
panel_icon: mdi:police-badge-outline
panel_title: Marshal
# Setup times, log entries and the Marketplace's list of installs, asked of Home Assistant (read-only)
homeassistant_api: true
# Home Assistant's configuration folder, read-only: custom_components is what gets scanned
map:
  - homeassistant_config:ro
options:
  rescan_hours: 24
  catalog_lookups: true
  vulnerability_lookups: true
  runtime_checks: true
  log_level: info
schema:
  rescan_hours: int(1,720)
  catalog_lookups: bool
  vulnerability_lookups: bool
  runtime_checks: bool
  log_level: list(debug|info|warning|error)
