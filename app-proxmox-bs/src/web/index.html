<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The top bar is as high as Home Assistant's own header (its --header-height, 56px by default) -->
<script>try{const h=getComputedStyle(window.parent.document.documentElement).getPropertyValue('--header-height').trim();if(h)document.documentElement.style.setProperty('--ha-header-height',h);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxmox Backup Server</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234c8dff' d='M12 3C7 3 3 4.8 3 7v10c0 2.2 4 4 9 4s9-1.8 9-4V7c0-2.2-4-4-9-4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="static/app.css?v=__VERSION__">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3C7 3 3 4.8 3 7v10c0 2.2 4 4 9 4s9-1.8 9-4V7c0-2.2-4-4-9-4zm0 2c4.4 0 7 1.5 7 2s-2.6 2-7 2-7-1.5-7-2 2.6-2 7-2zm-7 4.7C6.6 10.5 9.2 11 12 11s5.4-.5 7-1.3V12c0 .5-2.6 2-7 2s-7-1.5-7-2zm0 5C6.6 15.5 9.2 16 12 16s5.4-.5 7-1.3V17c0 .5-2.6 2-7 2s-7-1.5-7-2z"/></svg>
    <span class="brand-name">PROXMOX BACKUP SERVER</span>
  </div>
  <span id="status" class="status"><span class="dot"></span><span id="status-text">Checking…</span></span>
  <span class="spacer"></span>
  <div class="tabs" role="group" aria-label="PBS">
    <button type="button" class="tab" id="reload" title="Reload PBS's interface">Reload</button>
    <a class="tab" id="open-tab" target="_blank" rel="noopener" title="Open PBS's interface in its own browser tab">Open in new tab</a>
  </div>
  <div class="tabs" role="group" aria-label="Theme">
    <button type="button" id="theme-toggle" class="tab icon-tab" onclick="cycleTheme()" title="Theme"><span id="theme-icon" aria-hidden="true">☀️</span></button>
  </div>
  <span id="clock" class="clock"></span>
</header>

<main class="stage">
  <iframe id="pbs" title="Proxmox Backup Server" hidden></iframe>
  <div id="message" class="message" hidden>
    <div class="card">
      <h2 id="msg-title"></h2>
      <div id="msg-body"></div>
      <div class="row">
        <a class="btn btn-primary" id="msg-open" target="_blank" rel="noopener">Open Proxmox Backup Server</a>
        <button type="button" class="btn" id="msg-retry">Try again</button>
      </div>
    </div>
  </div>
</main>

<script src="static/app.js?v=__VERSION__"></script>
</body>
</html>
