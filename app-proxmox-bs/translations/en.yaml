configuration:
  root_password:
    name: Root password
    description: >-
      Password of the root user of this backup server (root@pam), to log in to
      its web interface and console on port 8007. Not your Home Assistant or
      Proxmox VE password. Empty locks the account: nobody can log in.
  log_level:
    name: Log level
    description: Amount of logging. PBS's own messages appear in the log too.
