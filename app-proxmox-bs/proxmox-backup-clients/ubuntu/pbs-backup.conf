# Settings for pbs-backup. Keep this file readable by root only (chmod 600): it holds the token's secret.

# Where to: <user>@pbs!<token>@<PBS address>:<datastore>  (port 8007 is the default)
PBS_REPOSITORY='hosts@pbs!backup@192.168.1.20:backups'

# The token's secret, printed once when the token was made
PBS_PASSWORD='paste-the-token-secret-here'

# PBS's certificate fingerprint: PBS -> Datastore -> backups -> Summary -> Show Connection Information
PBS_FINGERPRINT='AB:CD:...'

# The directories to back up, each its own archive in the snapshot
BACKUP_DIRS=(
    /etc
    /home
)

# Optional: left out of every archive (gitignore-like patterns)
EXCLUDES=(
    '.cache'
    '*.tmp'
    'node_modules'
)

# Optional: the name of this host's backups on PBS (default: the short host name)
#BACKUP_ID='myhost'

# Optional: a namespace on the datastore to keep hosts apart from Proxmox VE's backups.
# Create it first in PBS (Datastore -> backups -> Content -> Add Namespace)
#PBS_NAMESPACE='hosts'

# Optional: encrypt on this host before sending. Create the key once with
#   proxmox-backup-client key create /etc/pbs-backup.key --kdf none
# and keep a copy somewhere else: without it the backups can't be restored
#KEYFILE='/etc/pbs-backup.key'

# Optional: also back up file systems mounted below a directory (default: stay on the directory's own)
#ALL_FILE_SYSTEMS=true

# Optional: metadata (fast: unchanged files are not read again), data, or legacy
#CHANGE_DETECTION=metadata
