<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The top bar is as high as Home Assistant's own header (its --header-height, 56px by default) -->
    <script>try{const h=getComputedStyle(window.parent.document.documentElement).getPropertyValue('--header-height').trim();if(h)document.documentElement.style.setProperty('--ha-header-height',h);}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBrain</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232bb3a3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9.5 3a3 3 0 0 0-3 3 3 3 0 0 0-2.5 4.5A3.5 3.5 0 0 0 6 17a3 3 0 0 0 3.5 3.5c1 0 2-.5 2.5-1.3V4.4A3 3 0 0 0 9.5 3zM14.5 3a3 3 0 0 1 3 3 3 3 0 0 1 2.5 4.5A3.5 3.5 0 0 1 18 17a3 3 0 0 1-3.5 3.5c-1 0-2-.5-2.5-1.3'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="static/app.css?v=__VERSION__"/>
    <link rel="stylesheet" href="static/mybrain.css?v=__VERSION__"/>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3a3 3 0 0 0-3 3 3 3 0 0 0-2.5 4.5A3.5 3.5 0 0 0 6 17a3 3 0 0 0 3.5 3.5c1 0 2-.5 2.5-1.3V4.4A3 3 0 0 0 9.5 3z"/><path d="M14.5 3a3 3 0 0 1 3 3 3 3 0 0 1 2.5 4.5A3.5 3.5 0 0 1 18 17a3 3 0 0 1-3.5 3.5c-1 0-2-.5-2.5-1.3"/></svg>
            <span class="brand-name">MYBRAIN</span>
        </div>
        <nav class="tabs" id="nav" aria-label="Views">
            <button type="button" class="tab" data-tab="overview" onclick="switchTab('overview')">Overview</button>
            <button type="button" class="tab" data-tab="inbox" onclick="switchTab('inbox')">Inbox<span class="tab-count" id="nav-inbox"></span></button>
            <button type="button" class="tab" data-tab="library" onclick="switchTab('library')">Library</button>
            <button type="button" class="tab" data-tab="history" onclick="switchTab('history')">History</button>
            <span class="tab-sep" aria-hidden="true"></span>
            <button type="button" class="tab" data-tab="info" onclick="switchTab('info')" title="Info"><span class="tab-label">Info</span><span class="tab-icon" aria-hidden="true">ⓘ</span></button>
        </nav>
        <span class="spacer"></span>
        <div class="tabs" role="group" aria-label="Add">
            <button type="button" id="add-button" class="tab" onclick="openAdd()" title="Save a link or a note (or press n)">+ Add</button>
        </div>
        <div class="tabs" role="group" aria-label="Theme">
            <button type="button" id="theme-toggle" class="tab icon-tab" onclick="cycleTheme()" title="Theme"><span id="theme-icon" aria-hidden="true">🌓</span></button>
        </div>
        <span id="clock" class="clock"></span>
    </header>

    <div class="views">
        <div class="pages" id="pages">
            <div class="container">
                <div id="notices"></div>
                <div id="tab-overview" class="tab-content"></div>
                <div id="tab-inbox" class="tab-content"></div>
                <div id="tab-library" class="tab-content"></div>
                <div id="tab-history" class="tab-content"></div>
                <div id="tab-info" class="tab-content"></div>
            </div>
        </div>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
    <div id="toast-root"></div>
    <div id="sheet-root"></div>
    <div id="modal-root"></div>

    <script src="static/core.js?v=__VERSION__"></script>
    <script src="static/charts.js?v=__VERSION__"></script>
    <script src="static/mybrain.js?v=__VERSION__"></script>
    <script src="static/pages.js?v=__VERSION__"></script>
    <script src="static/main.js?v=__VERSION__"></script>
    <script src="static/donate.js?v=__VERSION__" data-app="MyBrain" data-api="api/donate"></script>
</body>
</html>
