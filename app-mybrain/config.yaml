name: MyBrain
version: "0.1.1"
slug: app-mybrain
description: "Share links and notes from your phone in two taps; they are read, sorted and kept searchable, with an inbox and a dashboard so nothing saved gets forgotten"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-mybrain"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-mybrain"
ingress: true
panel_icon: mdi:brain
panel_title: MyBrain
# Everyone in the household has their own MyBrain, so the panel is not for administrators only
panel_admin: false
# Shares from the companion app arrive as mobile_app.share events; AI Task entities sort;
# a Local Calendar gets the items with a date; two sensors: the inbox and the next date
homeassistant_api: true

options:
  listen_shares: true
  fetch_pages: true
  # Always in the form, as the one option to fill in for AI sorting; empty: the built-in rules sort
  ai_task_entity: ""
  calendar_sync: true
  share_by_default: false
  categories:
    - Tech
    - Home Assistant
    - Home & DIY
    - Crypto & Finance
    - Recipes & Food
    - Shopping
    - Travel
    - Health & Sport
    - News
    - Entertainment
    - Learning
    - Work
    - Personal
    - Other
  log_level: info

schema:
  listen_shares: bool?
  fetch_pages: bool?
  ai_task_entity: str?
  calendar_sync: bool?
  calendar_entity: str?
  share_by_default: bool?
  categories:
    - str
  log_level: list(debug|info|warning|error)?
