configuration:
  listen_shares:
    name: Save what is shared
    description: >-
      Save what is shared to the Home Assistant app on your phone (the
      mobile_app.share event).
  fetch_pages:
    name: Read the pages
    description: >-
      Read the page behind a link: its title, picture and text, so it can be
      found by what it says.
  ai_task_entity:
    name: AI Task entity
    description: >-
      The AI Task entity that sorts (category, tags, what it is for, a summary
      and dates), like ai_task.deepseek. Empty: the built-in rules sort.
  calendar_sync:
    name: Fill the calendar
    description: >-
      Keep a Local Calendar in Home Assistant in step with the open items that
      have a due date or an on date.
  calendar_entity:
    name: Calendar entity
    description: >-
      The household calendar. Empty uses calendar.mybrain: add the Local
      Calendar integration and name the calendar MyBrain. Each person's own
      is a Local Calendar named MyBrain <name>.
  share_by_default:
    name: Share with the household by default
    description: >-
      Off: what someone saves is only theirs until they share it. On: the
      household sees new items unless they are marked private.
  categories:
    name: Categories
    description: The categories to sort into. Other is always added.
  log_level:
    name: Log level
    description: Amount of logging.
