<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Save to MyBrain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
    <div class="brand"><img src="icons/icon32.png" alt="">MyBrain</div>
    <div id="setup" hidden>
        <p>Tell the extension where your Home Assistant is first.</p>
        <button class="primary" id="open-options">Set up</button>
    </div>
    <form id="form" hidden>
        <div class="page">
            <div class="title" id="title"></div>
            <div class="url" id="url"></div>
        </div>
        <label for="note">Note <span class="hint">(optional)</span></label>
        <textarea id="note" placeholder="Why you keep it, what to do with it"></textarea>
        <div class="row">
            <span class="keys"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves</span>
            <button class="primary" type="submit" id="save">Save</button>
        </div>
        <div class="status" id="status" role="status"></div>
    </form>
    <script type="module" src="popup.js"></script>
</body>
</html>
