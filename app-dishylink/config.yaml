# https://developers.home-assistant.io/docs/apps/configuration
name: Dishylink
version: "1.0.4"
slug: app-dishylink
description: Starlink dish and router dashboard with recorded history, powered by Dishylink
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-dishylink"
arch:
  - aarch64
  - amd64
init: false
stage: experimental
# The dashboard is served through Home Assistant ingress (nginx on the default
# ingress port 8099 in front of the Dishylink browser host on 8080). Port 8080 can optionally be
# published for access without ingress, for example from a phone on the LAN.
ingress: true
panel_icon: mdi:satellite-uplink
panel_title: Dishylink
ports:
  8080/tcp: null
# Default role only: the start script reads the host's LAN address and MAC
# from /network/interface/default/info so the dashboard knows "this device".
hassio_api: true
# /tmp is RAM (tmpfs). With history_flush_minutes > 0 the recorder writes its
# per-minute snapshots there and the folder is copied to /data/historian on
# that interval and at shutdown, which keeps flash wear on SD/eMMC hosts low.
tmpfs: true
options:
  detect_host_identity: true
  history_flush_minutes: 15
schema:
  detect_host_identity: bool
  history_flush_minutes: int(0,1440)
  host_lan_ip: "str?"
  host_mac: "str?"
  dish_url: "url?"
  router_url: "url?"
image: "ghcr.io/cyberjunky/app-dishylink"
