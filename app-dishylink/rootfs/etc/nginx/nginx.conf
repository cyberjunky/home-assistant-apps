# Ingress proxy for the Dishylink browser host.
#
# Home Assistant's ingress gateway (172.30.32.2) is the only permitted client.
# It has already authenticated the user, so the browser Origin/Referer headers
# are dropped here: Dishylink only accepts writes whose Origin is a LAN address,
# which a remote Home Assistant session (for example through Nabu Casa) is not.
# Requests on the optional direct port 8080 bypass this proxy and keep
# Dishylink's own origin rules.
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 16m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream dishylink {
        server 127.0.0.1:8080;
        keepalive 8;
    }

    server {
        listen 8099 default_server;
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://dishylink;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
        }
    }
}
