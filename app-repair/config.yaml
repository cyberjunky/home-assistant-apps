name: Repair
version: "0.1.1"
slug: app-repair
description: "Finds what is wrong in Home Assistant - devices that don't answer, faulty configuration, software faults, things left behind - explains it, and repairs or removes it for you"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-repair"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-repair"
ingress: true
panel_icon: mdi:stethoscope
panel_title: Repair
# Entities, devices, integrations, the log, statistics and repairs are read from Core, and changed through it
homeassistant_api: true
# The Supervisor's resolution centre: what it finds wrong with the system, and its suggestions
hassio_api: true
hassio_role: manager
# Only used with the deep_scan option, and only read: Home Assistant's database and registry files,
# for leftovers its API doesn't show. Mounted read-only, so the app could not change them if it tried
map:
  - type: homeassistant_config
    read_only: true

options:
  scan_minutes: 30
  check_config: true
  allow_fixes: true
  deep_scan: false
  log_level: info

schema:
  scan_minutes: int(5,1440)?
  check_config: bool?
  allow_fixes: bool?
  deep_scan: bool?
  log_level: list(debug|info|warning|error)?
