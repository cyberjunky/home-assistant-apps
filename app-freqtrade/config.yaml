name: Freqtrade
version: "0.1.1"
slug: app-freqtrade
description: "Dashboard for your Freqtrade trading bots - every bot's balance, profit and trades on one overview, a page per bot, live events over the bots' WebSocket"
url: "https://github.com/cyberjunky/home-assistant-apps/tree/main/app-freqtrade"
init: false
arch:
  - aarch64
  - amd64
# Prebuilt by the repository Builder workflow; bump `version` to publish a new image
image: "ghcr.io/cyberjunky/app-freqtrade"
ingress: true
panel_icon: mdi:robot-outline
panel_title: Freqtrade
services:
  - mqtt:want

options:
  bots: []
  poll_seconds: 30
  read_only: false
  mqtt:
    enabled: true
    host: ""
    port: 1883
    user: ""
    password: ""
    base_topic: freqtrade
    discovery_prefix: homeassistant
  log_level: info

schema:
  bots:
    - name: str
      url: url
      username: str
      password: password
      ws_token: password?
      verify_ssl: bool?
  poll_seconds: int(10,600)?
  read_only: bool?
  mqtt:
    enabled: bool?
    host: str?
    port: port?
    user: str?
    password: password?
    base_topic: 'match(^[A-Za-z0-9_/-]+$)?'
    discovery_prefix: 'match(^[A-Za-z0-9_/-]+$)?'
  log_level: list(debug|info|warning|error)?
